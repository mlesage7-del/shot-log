<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course Tracer / JSON Writer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --paper: #EDEFEC;
    --ink: #14170F;
    --muted: #757B72;
    --rule: #C9CDC5;
    --mark: #EE4B0A;
    --good: #2F6B37;
    --water: #3A5A8C;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: var(--sans);
    background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    background: var(--ink); color: var(--paper);
    padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: 0.05em; }
  header a { color: var(--rule); font-size: 0.8125rem; text-decoration: none; }
  #map { flex: 1; width: 100%; background: #222; }
  .panel {
    background: var(--paper); border-top: 2px solid var(--ink);
    padding: 0.75rem 1rem max(1rem, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 0.625rem;
  }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  label { font: 600 0.6875rem/1 var(--sans); text-transform: uppercase; color: var(--muted); letter-spacing: 0.08em; }
  input, select, button { font-family: var(--sans); }
  input, select {
    padding: 0.5rem; border: 1px solid var(--rule); border-radius: 2px;
    background: #fff; font-size: 0.875rem; color: var(--ink);
  }
  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.375rem; }
  .mode-btn {
    padding: 0.625rem 0.25rem; border: 1px solid var(--rule);
    background: #fff; font-size: 0.75rem; font-weight: 600;
    text-transform: uppercase; color: var(--muted); cursor: pointer; text-align: center;
  }
  .mode-btn.active[data-mode="green"] { background: var(--good); color: #fff; border-color: var(--good); }
  .mode-btn.active[data-mode="corner"] { background: var(--mark); color: #fff; border-color: var(--mark); }
  .mode-btn.active[data-mode="hazard"] { background: var(--water); color: #fff; border-color: var(--water); }
  .action-btn {
    padding: 0.625rem; border: 1px solid var(--ink); border-radius: 2px;
    background: var(--ink); color: var(--paper); font-weight: 600; font-size: 0.75rem;
    text-transform: uppercase; cursor: pointer; flex: 1;
  }
  .action-btn.secondary { background: transparent; color: var(--ink); }
  #jsonOutput {
    width: 100%; height: 80px; font-family: var(--mono); font-size: 0.7rem;
    padding: 0.5rem; border: 1px solid var(--rule); background: #fff; resize: none;
  }
</style>
</head>
<body>

<header>
  <h1>Course Tracer v2</h1>
  <a href="index.html">&larr; Back to Shot Log</a>
</header>

<div id="map"></div>

<div class="panel">
  <div class="row">
    <div style="flex:1">
      <label for="courseName">Course Name</label>
      <input type="text" id="courseName" value="Glendale Golf & Country Club" style="width:100%">
    </div>
    <div style="width: 80px;">
      <label for="holeSelect">Hole</label>
      <select id="holeSelect" style="width:100%"></select>
    </div>
  </div>

  <div class="modes">
    <button class="mode-btn active" data-mode="green">Green Pin</button>
    <button class="mode-btn" data-mode="corner">Dogleg</button>
    <button class="mode-btn" data-mode="hazard">Water Polygon</button>
  </div>

  <div class="row">
    <button class="action-btn secondary" id="clearHoleBtn">Clear Hole</button>
    <button class="action-btn secondary" id="closeHazardBtn" hidden>Close Water Poly</button>
    <button class="action-btn" id="exportBtn">Download course.json</button>
  </div>

  <textarea id="jsonOutput" readonly placeholder="Course JSON generates here..."></textarea>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

let map;
let currentHole = 1;
let currentMode = "green"; // green | corner | hazard
let activePolygonPts = [];

let courseData = {
  id: "glendale",
  name: "Glendale Golf & Country Club",
  holes: Array.from({ length: 18 }, (_, i) => ({
    number: i + 1,
    green: null,
    corners: [],
    hazards: []
  }))
};

const layerGroup = L.layerGroup();

function initMap() {
  // Default centered near Winnipeg / Glendale
  map = L.map('map').setView([49.88, -97.30], 16);
  
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Esri Satellite'
  }).addTo(map);

  layerGroup.addTo(map);
  map.on('click', handleMapClick);

  // Populate hole dropdown
  const select = document.getElementById("holeSelect");
  for (let i = 1; i <= 18; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = i;
    select.appendChild(opt);
  }

  select.addEventListener("change", e => {
    currentHole = Number(e.target.value);
    activePolygonPts = [];
    document.getElementById("closeHazardBtn").hidden = true;
    renderLayers();
  });

  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentMode = btn.dataset.mode;
      activePolygonPts = [];
      document.getElementById("closeHazardBtn").hidden = true;
    });
  });

  document.getElementById("courseName").addEventListener("input", e => {
    courseData.name = e.target.value;
    courseData.id = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, "_");
    updateOutput();
  });

  document.getElementById("clearHoleBtn").addEventListener("click", () => {
    courseData.holes[currentHole - 1] = { number: currentHole, green: null, corners: [], hazards: [] };
    activePolygonPts = [];
    document.getElementById("closeHazardBtn").hidden = true;
    renderLayers();
    updateOutput();
  });

  document.getElementById("closeHazardBtn").addEventListener("click", () => {
    if (activePolygonPts.length >= 3) {
      courseData.holes[currentHole - 1].hazards.push({
        type: "water",
        polygon: activePolygonPts
      });
      activePolygonPts = [];
      document.getElementById("closeHazardBtn").hidden = true;
      renderLayers();
      updateOutput();
    }
  });

  document.getElementById("exportBtn").addEventListener("click", exportFile);

  updateOutput();
}

function handleMapClick(e) {
  const lat = Number(e.latlng.lat.toFixed(6));
  const lng = Number(e.latlng.lng.toFixed(6));
  const hole = courseData.holes[currentHole - 1];

  if (currentMode === "green") {
    hole.green = { lat, lng };
  } else if (currentMode === "corner") {
    hole.corners.push({ lat, lng });
  } else if (currentMode === "hazard") {
    activePolygonPts.push([lat, lng]);
    document.getElementById("closeHazardBtn").hidden = activePolygonPts.length < 3;
  }

  renderLayers();
  updateOutput();
}

function renderLayers() {
  layerGroup.clearLayers();
  const hole = courseData.holes[currentHole - 1];

  if (hole.green) {
    L.circleMarker([hole.green.lat, hole.green.lng], {
      radius: 10, color: '#fff', fillColor: '#2F6B37', fillOpacity: 0.9, weight: 2
    }).bindTooltip("Green " + currentHole, { permanent: true, direction: 'top' }).addTo(layerGroup);
  }

  hole.corners.forEach((c, i) => {
    L.circleMarker([c.lat, c.lng], {
      radius: 6, color: '#EE4B0A', fillColor: '#EE4B0A', fillOpacity: 0.8
    }).bindTooltip("Corner " + (i + 1), { permanent: false }).addTo(layerGroup);
  });

  hole.hazards.forEach(hz => {
    L.polygon(hz.polygon, { color: '#3A5A8C', fillColor: '#3A5A8C', fillOpacity: 0.5 }).addTo(layerGroup);
  });

  if (activePolygonPts.length) {
    L.polyline(activePolygonPts, { color: '#3A5A8C', dashArray: '4,4' }).addTo(layerGroup);
    activePolygonPts.forEach(p => {
      L.circleMarker(p, { radius: 4, color: '#3A5A8C', fillColor: '#fff', fillOpacity: 1 }).addTo(layerGroup);
    });
  }
}

function updateOutput() {
  document.getElementById("jsonOutput").value = JSON.stringify(courseData, null, 2);
}

function exportFile() {
  const blob = new Blob([JSON.stringify(courseData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "course.json";
  a.click();
  URL.revokeObjectURL(url);
}

window.onload = initMap;
</script>
</body>
</html>
